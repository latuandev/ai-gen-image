networks:
  ai_gen_image_network:
    name: ai_gen_image_network
    driver: bridge

services:
  api:
    container_name: ai_gen_image_api
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ai_gen_image_network
  db:
    container_name: ai_gen_image_db
    image: postgres:18.4-bookworm
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ai_gen_image_network

volumes:
  postgres_data:
