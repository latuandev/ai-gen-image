[tool.ruff]
target-version = "py314"
line-length = 99
indent-width = 4

extend-exclude = [
    "**/migrations/*.py",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
